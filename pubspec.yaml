name: goodshare
description: "A new Flutter project."
publish_to: 'none'
version: 1.2.1+8051 # 整包 versionCode=pub 原值；真机已装 8031（旧拆分包 6031+2000），整包须 ≥8033 才能覆盖。arm64-v8a 拆分包 versionCode=pub+2000

environment:
  sdk: ^3.13.4

dependencies:
  crypto: ^3.0.7
  dio: ^5.11.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_foreground_task: ^11.0.3
  battery_plus: ^7.1.1
  google_mlkit_text_recognition: ^0.17.1
  image_picker: ^1.2.3
  just_audio: ^0.10.6
  open_filex: ^4.7.0
  package_info_plus: ^10.2.1
  palette_generator: ^0.3.3+7
  path: ^1.9.1
  path_provider: ^2.1.6
  receive_sharing_intent: ^1.9.0
  record: ^7.1.1
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  sherpa_onnx: ^1.13.8
  sqflite: ^2.4.4
  video_player: ^2.14.0
  google_mlkit_translation: ^0.15.1
  google_mlkit_image_labeling: ^0.16.1
  google_mlkit_barcode_scanning: ^0.16.1
  google_mlkit_language_id: ^0.15.1
  google_mlkit_entity_extraction: ^0.17.1
  google_mlkit_document_scanner: ^0.6.1
  pdfrx: ^2.6.5
  pdf: ^3.11.3
  flutter_staggered_grid_view: ^0.7.0
  camera: ^0.12.1
  flutter_svg: ^2.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3
  flutter_launcher_icons: ^0.14.0
  camera_platform_interface: ^2.14.0

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/models/silero_vad_v5.onnx
    - assets/glyphs/nautilus.svg
    - assets/glyphs/knot_diagram.png
    - assets/fonts/DroidSansFallbackFull.ttf

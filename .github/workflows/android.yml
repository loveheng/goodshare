# 拾贝（goodshare）Android 云端构建
# - push main / PR / 手动触发：analyze + test + release 构建 + 产物上传
# - 推送 v* 标签：额外创建 GitHub Release 并附 APK（供手机端自更新下载）
# 约定：release APK 使用 debug 签名（个人使用口径，仓库内无 keystore，勿加 secrets）

name: android-ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # 仅 Release 步骤需要（写 tag release）

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gradle 9.3.1 需要 JDK 17+；与本地工具链对齐
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 版本锁定与本地一致（workflow skill：Flutter 3.47.5 stable）
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      # 专门的 Android SDK action：自带【最新】cmdline-tools，仓库元数据能正确识别
      # compileSdk 37 平台（flutter-action 自带的 sdkmanager 元数据过旧，找不到
      # platforms;android-37，导致云端构建失败）。与本地 ~/android-sdk 口径一致：
      # platforms;android-37 + build-tools;36.0.0。该 action 会自动设 ANDROID_HOME。
      - name: 安装 Android SDK（compileSdk 37 / build-tools 36.0.0）
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37 build-tools;36.0.0 platform-tools'

      - name: 依赖
        run: flutter pub get

      - name: 静态检查（0 issue 交付线）
        run: flutter analyze

      - name: 单测（全过交付线）
        run: flutter test

      # 只构建 arm64-v8a（2026-09-27 决策）。注意：--target-platform 必须配合
      # --split-per-abi 才会真正裁 ABI（单用仍产出三架构包），产物为 app-arm64-v8a-release.apk
      - name: 构建 Release APK（arm64）
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: 计算校验和
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum app-arm64-v8a-release.apk | tee sha256sums.txt

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/sha256sums.txt
          if-no-files-found: error

      - name: 发布 Release（仅 v* 标签）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/sha256sums.txt
          body: |
            拾贝 ${{ github.ref_name }}（debug 签名，个人使用，仅 arm64-v8a）
